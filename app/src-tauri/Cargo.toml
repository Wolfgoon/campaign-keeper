[package]
name = "campaign-keeper"
version = "2.0.7"
edition = "2021"
description = "Play tabletop-style campaigns with Claude as your Game Master"

[lib]
name = "campaign_keeper_lib"
crate-type = ["rlib"]

[[bin]]
name = "campaign-keeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
regex = "1"
similar = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
walkdir = "2"
include_dir = "0.7"
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
