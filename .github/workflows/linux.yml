# Builds the Linux app (an AppImage) on GitHub's Ubuntu runners, since a Linux build needs a Linux
# machine: the Mac and Windows ones can't cross-compile it.
# Run it by hand: GitHub > Actions > "Linux build" > Run workflow. The file appears under
# "Artifacts" on the finished run as "Campaign Keeper (Linux and Steam Deck)".
#
# The AppImage is the one file that runs on a Steam Deck in Desktop Mode and on any other x86_64
# desktop. It is built on ubuntu-22.04 on purpose, not ubuntu-latest: 22.04's glibc (2.35) is old
# enough for every SteamOS 3.x and Debian 12 / Ubuntu 22.04 and later, while a build on 24.04 would
# refuse to start there. Tauri's bundler copies GTK, WebKitGTK, soup and the icons *into* the file,
# so the AppImage needs nothing installed but the Mesa GL libraries SteamOS (and every desktop) has.
# Checked on a plain ubuntu-22.04 runner with no webkit2gtk at all: the window draws (3.1.2).
name: Linux build

on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux app (.AppImage)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libfuse2 file
      - run: npm ci
      - run: npm run tauri build -- --bundles appimage
      - name: Name it after the version
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p ../installers
          cp src-tauri/target/release/bundle/appimage/*.AppImage \
            "../installers/Campaign Keeper $version (Linux & Steam Deck).AppImage"
          ls -l "../installers/Campaign Keeper $version (Linux & Steam Deck).AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: Campaign Keeper (Linux and Steam Deck)
          path: installers/Campaign Keeper *.AppImage
